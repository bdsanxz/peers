[package]
name = "peers"
version = "0.0.5"
edition = "2021"
description = "Inbox messenger between OpenCode, Claude Code, Antigravity, pi and Muse Code agent sessions on one machine"
repository = "https://github.com/bdsanxz/peers"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "peers"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }

[profile.release]
strip = true
lto = true
